# =============================================================================
#  build - the repo's single, authoritative app compiler.
#
#  Every push, every PR, every tag, on demand, and nightly: the same two
#  artifacts get produced by the same `make` targets a developer runs locally
#  (Makefile -> packaging/windows/build_exe.ps1 + packaging/linux/build_appimage.sh)
#  and both are gated by packaging/verify.sh. A tag push additionally attaches
#  them to a GitHub Release.
#
#  Both compilers are exercised on the platform they ship for, not on a
#  convenient stand-in: the .exe is built and launched on a real Windows
#  runner, and the .AppImage is built inside Fedora with a live Wayland
#  session, then executed there.
# =============================================================================
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      wine_smoke:
        description: "Also install Wine in the Fedora job and try to launch the packaged exe"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC - catch toolchain/offset rot

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # ---------------------------------------------------------------- version --
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # tags, for packaging/version.sh
      - id: v
        run: |
          v="$(packaging/version.sh)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=version::$v"

  # ------------------------------------------------------------------- lint --
  lint:
    name: lint packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          for f in packaging/version.sh packaging/verify.sh packaging/pe_info.sh \
                   packaging/linux/build_appimage.sh packaging/linux/AppRun.in; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning packaging/version.sh packaging/verify.sh \
                                packaging/pe_info.sh \
                                packaging/linux/build_appimage.sh
      - name: powershell syntax
        shell: pwsh
        run: |
          foreach ($f in @('packaging/version.ps1','packaging/windows/build_exe.ps1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "ok  $f"
          }
      - name: pe_info self-test
        run: |
          # A synthetic PE32+ GUI image: proves the inspector accepts a correct
          # header and rejects a wrong one, so a green "is a valid x64 Windows
          # image" later in the run means something.
          python3 - <<'PY'
          import struct
          buf = bytearray(b'\x00' * 0x80)
          buf[0:2] = b'MZ'
          struct.pack_into('<I', buf, 0x3C, 0x80)
          coff = struct.pack('<HHIIIHH', 0x8664, 3, 1759500000, 0, 0, 240, 0x0022)
          opt = bytearray(240)
          struct.pack_into('<H', opt, 0, 0x20B)
          struct.pack_into('<I', opt, 56, 0x9F000)
          struct.pack_into('<H', opt, 68, 2)
          struct.pack_into('<H', opt, 70, 0x8160)
          body = b'\x00'*1024 + b'd3d11.dll\x00dxgi.dll\x00winhttp.dll\x00' + b'\x00'*70000
          open('/tmp/good.exe','wb').write(bytes(buf) + b'PE\x00\x00' + coff + bytes(opt) + body)
          open('/tmp/bad.exe','wb').write(b'not a pe at all\n' * 100)
          PY
          packaging/pe_info.sh /tmp/good.exe --expect-machine x64 --expect-subsystem gui \
                               --min-size 65536 --expect-import d3d11.dll
          ! packaging/pe_info.sh /tmp/bad.exe  --expect-machine x64 2>/dev/null
          ! packaging/pe_info.sh /tmp/good.exe --expect-machine arm64 2>/dev/null
          echo "pe_info self-test passed"

  # ---------------------------------------------------------- windows .exe --
  windows-exe:
    name: compile .exe (Windows)
    needs: [version, lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: microsoft/setup-msbuild@v2

      # Which Windows actually compiled this - recorded in the log so the
      # artifact's provenance is not a matter of trust.
      - name: host
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cv = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $ubr = (Get-ItemProperty $cv -Name UBR -ErrorAction SilentlyContinue).UBR
          $disp = (Get-ItemProperty $cv -Name DisplayVersion -ErrorAction SilentlyContinue).DisplayVersion
          Write-Host "product        : $($os.Caption)"
          Write-Host "release        : $disp"
          Write-Host "version        : $($os.Version).$ubr  (build $($os.BuildNumber))"
          Write-Host "architecture   : $($os.OSArchitecture) / $env:PROCESSOR_ARCHITECTURE"
          Write-Host "cpu            : $((Get-CimInstance Win32_Processor | Select-Object -First 1).Name)"
          Write-Host "logical cores  : $env:NUMBER_OF_PROCESSORS"
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsw) {
            & $vsw -latest -prerelease -products * -property displayName
            & $vsw -latest -prerelease -products * -property installationVersion
            $root = & $vsw -latest -prerelease -products * -property installationPath
            Write-Host "msvc toolsets  : $((Get-ChildItem "$root\VC\Tools\MSVC" -Directory -EA SilentlyContinue).Name -join ', ')"
          }
          Write-Host "windows sdks   : $((Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory -EA SilentlyContinue).Name -join ', ')"
          Write-Host "msbuild        : $((Get-Command msbuild.exe -EA SilentlyContinue).Source)"
          Write-Host "::notice title=windows host::$($os.Caption) $disp build $($os.Version).$ubr, $($os.OSArchitecture)"

      - name: make exe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/logs
          make exe VERSION="${{ needs.version.outputs.version }}" 2>&1 | tee dist/logs/make.log
          # Provenance on the run page: raw logs need a download, annotations do not.
          echo "::notice title=build-info::$(tr '\n' ' ' < dist/windows/build-info.txt)"

      # Annotations are readable without downloading the raw log, so a failed
      # compile always says why right on the run page.
      - name: surface failure
        if: failure()
        shell: bash
        run: |
          log=dist/logs/make.log
          # Real diagnostics first (compiler/linker errors), tail only as a
          # fallback - GitHub shows at most ~10 annotations.
          lines="$(grep -aiE ' error [A-Z]+[0-9]+|error:|fatal error|ERROR:' "$log" 2>/dev/null | head -n 8)"
          [ -z "$lines" ] && lines="$(tail -n 8 "$log" 2>/dev/null)"
          printf '%s\n' "$lines" | sed 's/::/:/g' | while IFS= read -r l; do
            [ -n "$l" ] && echo "::error title=make exe::$l"
          done
          exit 1

      - name: make verify
        shell: bash
        run: packaging/verify.sh --windows

      # Does the thing we just built actually load and run on Windows? Without
      # Roblox and without a GPU it will not get far, but a bad link, a missing
      # DLL (0xC0000135) or an unsupported instruction (0xC000001D) all show up
      # here as a negative NTSTATUS exit code instead of in a user's lap.
      - name: smoke run
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Resolve-Path 'dist/windows/glass-widget/glass-widget.exe'
          Write-Host "launching $exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline = (Get-Date).AddSeconds(40)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }

          if (-not $p.HasExited) {
            Write-Host "::notice title=smoke run::still running after 40s (overlay loop alive) - stopping it"
            Stop-Process -Id $p.Id -Force
            exit 0
          }

          $p.WaitForExit()
          $code = $p.ExitCode
          $hex  = '0x{0:X8}' -f ([uint32]([int64]$code -band 0xFFFFFFFF))
          Write-Host "exited with $code ($hex)"
          if ($code -lt 0) {
            Write-Host "::error title=smoke run::glass-widget.exe crashed with $hex"
            switch ($hex) {
              '0xC0000135' { Write-Host "::error::STATUS_DLL_NOT_FOUND - a linked DLL is missing on the host" }
              '0xC000001D' { Write-Host "::error::STATUS_ILLEGAL_INSTRUCTION - built for a CPU newer than the host (AVX2)" }
              '0xC0000005' { Write-Host "::error::STATUS_ACCESS_VIOLATION during startup" }
            }
            exit 1
          }
          Write-Host "::notice title=smoke run::clean exit $code (no GPU/no Roblox on the runner is expected)"

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: dist/logs/*
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: glass-widget-windows-${{ needs.version.outputs.version }}
          path: dist/windows/glass-widget/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - uses: actions/upload-artifact@v4
        with:
          name: glass-widget-windows-zip
          path: |
            dist/windows/*.zip
            dist/windows/build-info.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ------------------------------------------------------ linux .AppImage --
  #  Built on Fedora rather than on the Ubuntu runner, under a real Wayland
  #  compositor: that is the desktop this ships to, and "it packaged on Ubuntu"
  #  is not evidence about it.
  linux-appimage:
    name: compile .AppImage (Fedora, Wayland)
    needs: [version, windows-exe]
    runs-on: ubuntu-latest
    container:
      image: "fedora:44"
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - name: fedora identity + tooling
        run: |
          set -e
          cat /etc/os-release
          echo "kernel: $(uname -a)"
          dnf -y install --setopt=install_weak_deps=False \
            git make tar gzip findutils diffutils coreutils which file \
            desktop-file-utils python3 curl ca-certificates \
            weston wayland-utils mesa-dri-drivers
          echo "weston: $(weston --version 2>&1 | head -1)"
          . /etc/os-release
          echo "::notice title=linux host::$PRETTY_NAME, kernel $(uname -r), $(weston --version 2>&1 | head -1)"

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # A genuine Wayland session (headless compositor, no X server anywhere),
      # so the packaging step and the AppImage smoke run below are not quietly
      # happening on a bare TTY.
      - name: start a Wayland session
        run: |
          set -e
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-ci
          weston --backend=headless --socket="$WAYLAND_DISPLAY" --idle-time=0 \
                 --width=1920 --height=1080 >/tmp/weston.log 2>&1 &
          for _ in $(seq 1 60); do
            [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
            sleep 0.5
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            echo "::error title=wayland::compositor never created $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            cat /tmp/weston.log; exit 1
          fi
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY" >> "$GITHUB_ENV"
          echo "--- wayland-info ---"
          wayland-info | head -n 25
          echo "::notice title=wayland::compositor up on $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY, globals: $(wayland-info 2>/dev/null | grep -c 'interface:')"

      - uses: actions/download-artifact@v4
        with:
          name: glass-widget-windows-${{ needs.version.outputs.version }}
          path: payload

      - name: make appimage
        run: |
          echo "session type: ${XDG_SESSION_TYPE:-wayland (headless weston)} / WAYLAND_DISPLAY=$WAYLAND_DISPLAY / DISPLAY=${DISPLAY:-<unset>}"
          make appimage EXE="$PWD/payload/glass-widget.exe" VERSION="${{ needs.version.outputs.version }}"
          img="$(ls dist/linux/*.AppImage | head -1)"
          echo "::notice title=appimage::$(basename "$img") $(wc -c < "$img") bytes sha256=$(sha256sum "$img" | cut -d' ' -f1)"

      - name: make verify
        run: packaging/verify.sh --linux

      # Execute the thing we just produced, on Fedora, in the Wayland session.
      # Wine is deliberately absent here, so the expected outcome is AppRun's
      # actionable "install wine" message - which still proves the runtime
      # mounted, AppRun ran, and the offset table was installed.
      - name: AppImage smoke run
        run: |
          set -o pipefail
          img="$(ls dist/linux/*.AppImage | head -1)"
          echo "running $img"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" 2>&1 | tee /tmp/apprun.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc"
          if [ "$rc" -ne 1 ] || ! grep -q "Wine not found" /tmp/apprun.log; then
            echo "::error title=AppImage smoke run::expected AppRun to stop with the 'Wine not found' message, got exit $rc"
            exit 1
          fi
          test -f "$HOME/.local/share/glass-widget/offsets_fallback.json" \
            || { echo "::error::AppRun did not install offsets_fallback.json into the data dir"; exit 1; }
          echo "::notice title=AppImage smoke run::AppRun ran from inside the AppImage on Fedora+Wayland, stopped at the Wine check (exit 1) and seeded offsets_fallback.json"
          echo "AppRun executed from inside the AppImage and failed exactly where it should"

      # Opt-in (workflow_dispatch): the payload is a Windows binary that talks
      # to the NT syscall layer directly, so this is expected to be informative
      # rather than green. It never gates the build.
      # Opt in with `wine_smoke: true` on a manual run, or by putting [wine] in
      # the commit message. The payload is a Windows binary that goes straight
      # at the NT syscall layer, so this is expected to be informative rather
      # than green. It never gates the build.
      - name: Wine launch attempt (informational)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.wine_smoke) || contains(github.event.head_commit.message || '', '[wine]') }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          dnf -y install wine >/tmp/dnf-wine.log 2>&1
          if ! command -v wine >/dev/null 2>&1; then
            echo "::warning title=wine::could not install wine on Fedora 44: $(tail -n 3 /tmp/dnf-wine.log | tr '\n' ' ')"
            exit 0
          fi
          ver="$(wine --version 2>&1 | head -1)"
          echo "wine: $ver"
          img="$(ls dist/linux/*.AppImage | head -1)"
          APPIMAGE_EXTRACT_AND_RUN=1 WINEDEBUG=err+all timeout 240 "$img" >/tmp/wine-run.log 2>&1
          rc=$?
          tail -n 60 /tmp/wine-run.log
          # Annotations are the only part of a run readable without downloading
          # the log, and this answer is the point of the step.
          echo "::notice title=wine launch::$ver on Fedora 44 + Wayland -> exit $rc :: $(grep -aiE "err:|wine:|Unhandled|not found|0x[0-9a-f]{8}" /tmp/wine-run.log | tail -n 6 | tr '\n' ' ' | sed 's/::/:/g' | cut -c1-700)"

      - uses: actions/upload-artifact@v4
        with:
          name: glass-widget-appimage-${{ needs.version.outputs.version }}
          path: dist/linux/*.AppImage
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ---------------------------------------------------------------- release --
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows-exe, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: find artifacts -type f -printf '%p  %s bytes\n'
      - uses: softprops/action-gh-release@v2
        with:
          name: glass-widget ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.zip
